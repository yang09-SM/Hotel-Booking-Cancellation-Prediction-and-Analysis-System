
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店预订智能管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1f2937;
            --light: #f3f4f6;
            --gray: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: white;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
            padding: 24px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--light);
        }

        .sidebar-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .sidebar-header p {
            font-size: 12px;
            color: var(--gray);
        }

        .nav-menu {
            margin-top: 24px;
        }

        .nav-item {
            padding: 14px 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: var(--light);
        }

        .nav-item.active {
            background: rgba(30, 64, 175, 0.1);
            border-left-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        .nav-icon {
            font-size: 20px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 32px;
        }

        .header {
            background: white;
            padding: 24px 32px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .header h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--dark);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--gray);
            font-weight: 500;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .stat-icon.blue { background: rgba(59, 130, 246, 0.15); }
        .stat-icon.green { background: rgba(16, 185, 129, 0.15); }
        .stat-icon.red { background: rgba(239, 68, 68, 0.15); }
        .stat-icon.yellow { background: rgba(245, 158, 11, 0.15); }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--dark);
        }

        /* Content Sections */
        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--light);
        }

        th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--dark);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--light);
            font-size: 14px;
        }

        tr:hover {
            background: rgba(30, 64, 175, 0.05);
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .badge-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .table-actions {
            display: flex;
            gap: 8px;
        }

        /* Form */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--dark);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 16px;
            border: 2px solid var(--light);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        /* Prediction Result */
        .prediction-result {
            margin-top: 24px;
            padding: 24px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.1) 0%, rgba(59, 130, 246, 0.1) 100%);
        }

        .prediction-label {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .prediction-canceled {
            color: var(--danger);
        }

        .prediction-confirmed {
            color: var(--success);
        }

        .probability-bar {
            margin-top: 12px;
        }

        .probability-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .probability-track {
            height: 12px;
            background: var(--light);
            border-radius: 6px;
            overflow: hidden;
        }

        .probability-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.8s ease;
        }

        /* Model Performance */
        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .model-card {
            background: linear-gradient(135deg, rgba(30, 64, 175, 0.05) 0%, rgba(59, 130, 246, 0.05) 100%);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid rgba(30, 64, 175, 0.1);
        }

        .model-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .model-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .metric-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
        }

        .metric-item-label {
            font-size: 11px;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .metric-item-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .page-btn {
            padding: 8px 16px;
            border: 2px solid var(--light);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .page-btn:hover,
        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--gray);
        }

        /* Search */
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--light);
            border-radius: 8px;
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
                padding: 16px;
            }

            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🏨 酒店管理</h1>
                <p>智能预订管理系统</p>
            </div>
            <nav class="nav-menu">
                <div class="nav-item active" data-section="dashboard">
                    <span class="nav-icon">📊</span>
                    <span>数据概览</span>
                </div>
                <div class="nav-item" data-section="bookings">
                    <span class="nav-icon">📋</span>
                    <span>预订管理</span>
                </div>
                <div class="nav-item" data-section="prediction">
                    <span class="nav-icon">🔮</span>
                    <span>取消预测</span>
                </div>
                <div class="nav-item" data-section="models">
                    <span class="nav-icon">🤖</span>
                    <span>模型评估</span>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Dashboard Section -->
            <section id="dashboard" class="content-section active">
                <div class="header">
                    <h2>📊 数据概览</h2>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <span class="stat-label">总预订数</span>
                            <div class="stat-icon blue">📝</div>
                        </div>
                        <div class="stat-value" id="total-bookings">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <span class="stat-label">已确认</span>
                            <div class="stat-icon green">✅</div>
                        </div>
                        <div class="stat-value" id="confirmed-bookings">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <span class="stat-label">已取消</span>
                            <div class="stat-icon red">❌</div>
                        </div>
                        <div class="stat-value" id="canceled-bookings">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <span class="stat-label">平均提前预订天数</span>
                            <div class="stat-icon yellow">📅</div>
                        </div>
                        <div class="stat-value" id="avg-lead-time">-</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">最新预订</h3>
                        <button class="btn btn-primary" onclick="navigateTo('bookings')">
                            查看全部 →
                        </button>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>酒店</th>
                                    <th>入住日期</th>
                                    <th>状态</th>
                                </tr>
                            </thead>
                            <tbody id="recent-bookings">
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- Bookings Section -->
            <section id="bookings" class="content-section">
                <div class="header">
                    <h2>📋 预订管理</h2>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">预订列表</h3>
                        <button class="btn btn-primary" onclick="openCreateModal()">
                            ➕ 新增预订
                        </button>
                    </div>

                    <div class="search-bar">
                        <input type="text" class="search-input" id="search-input" placeholder="搜索酒店、国家、市场...">
                        <button class="btn btn-primary" onclick="searchBookings()">🔍 搜索</button>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>酒店</th>
                                    <th>国家</th>
                                    <th>市场</th>
                                    <th>提前天数</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="bookings-table">
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination" id="pagination">
                    </div>
                </div>
            </section>

            <!-- Prediction Section -->
            <section id="prediction" class="content-section">
                <div class="header">
                    <h2>🔮 取消预测</h2>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">输入预订信息</h3>
                    </div>

                    <form id="prediction-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>酒店类型</label>
                                <select id="hotel">
                                    <option value="Resort Hotel">度假酒店</option>
                                    <option value="City Hotel">城市酒店</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>提前预订天数</label>
                                <input type="number" id="lead_time" value="60">
                            </div>
                            <div class="form-group">
                                <label>成人数量</label>
                                <input type="number" id="adults" value="2">
                            </div>
                            <div class="form-group">
                                <label>儿童数量</label>
                                <input type="number" id="children" value="0">
                            </div>
                            <div class="form-group">
                                <label>入住年份</label>
                                <input type="number" id="arrival_date_year" value="2017">
                            </div>
                            <div class="form-group">
                                <label>入住月份</label>
                                <input type="number" id="arrival_date_month" value="7" min="1" max="12">
                            </div>
                            <div class="form-group">
                                <label>周末住宿天数</label>
                                <input type="number" id="stays_in_weekend_nights" value="2">
                            </div>
                            <div class="form-group">
                                <label>工作日住宿天数</label>
                                <input type="number" id="stays_in_week_nights" value="3">
                            </div>
                            <div class="form-group">
                                <label>特殊要求数量</label>
                                <input type="number" id="total_of_special_requests" value="0">
                            </div>
                            <div class="form-group">
                                <label>预订变更次数</label>
                                <input type="number" id="booking_changes" value="0">
                            </div>
                            <div class="form-group">
                                <label>是否为回头客</label>
                                <select id="is_repeated_guest">
                                    <option value="0">否</option>
                                    <option value="1">是</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>选择模型</label>
                                <select id="model-select">
                                    <option value="XGBoost">XGBoost (推荐，GPU加速)</option>
                                    <option value="LightGBM">LightGBM (GPU加速)</option>
                                    <option value="Logistic Regression">逻辑回归</option>
                                    <option value="Neural Network">神经网络</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%;">
                            🔮 预测取消概率
                        </button>
                    </form>

                    <div id="prediction-result" style="display: none;">
                    </div>
                </div>
            </section>

            <!-- Models Section -->
            <section id="models" class="content-section">
                <div class="header">
                    <h2>🤖 模型评估</h2>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">模型性能对比</h3>
                    </div>
                    <div class="model-grid" id="model-performance">
                        <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">
                            请先运行 train_models.py 训练模型
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">新增预订</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="booking-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>酒店</label>
                        <select id="form-hotel">
                            <option value="Resort Hotel">度假酒店</option>
                            <option value="City Hotel">城市酒店</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>国家</label>
                        <input type="text" id="form-country" placeholder="例如: PRT">
                    </div>
                    <div class="form-group">
                        <label>市场细分</label>
                        <input type="text" id="form-market" placeholder="例如: Online TA">
                    </div>
                    <div class="form-group">
                        <label>提前预订天数</label>
                        <input type="number" id="form-lead-time" value="0">
                    </div>
                </div>
                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn" style="flex: 1; background: var(--light);" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5001/api';
        let currentPage = 1;
        const pageSize = 10;

        // Navigation
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const section = this.dataset.section;
                navigateTo(section);
            });
        });

        function navigateTo(section) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(item => item.classList.remove('active'));
            
            document.querySelector(`[data-section="${section}"]`).classList.add('active');
            document.getElementById(section).classList.add('active');

            if (section === 'dashboard') loadDashboard();
            if (section === 'bookings') loadBookings();
            if (section === 'models') loadModelPerformance();
        }

        // Load Dashboard
        async function loadDashboard() {
            try {
                const statsRes = await fetch(`${API_BASE}/statistics`);
                const stats = await statsRes.json();
                
                document.getElementById('total-bookings').textContent = stats.total_bookings || 0;
                document.getElementById('confirmed-bookings').textContent = stats.confirmed_bookings || 0;
                document.getElementById('canceled-bookings').textContent = stats.canceled_bookings || 0;
                document.getElementById('avg-lead-time').textContent = Math.round(stats.avg_lead_time || 0);

                const bookingsRes = await fetch(`${API_BASE}/bookings?limit=5`);
                const data = await bookingsRes.json();
                renderRecentBookings(data.bookings);
            } catch (err) {
                console.error('Error loading dashboard:', err);
            }
        }

        function renderRecentBookings(bookings) {
            const tbody = document.getElementById('recent-bookings');
            tbody.innerHTML = bookings.map(booking => `
                <tr>
                    <td>${booking.id}</td>
                    <td>${booking.hotel}</td>
                    <td>${booking.arrival_date_year}-${booking.arrival_date_month}-${booking.arrival_date_day_of_month || 1}</td>
                    <td>
                        <span class="badge ${booking.is_canceled ? 'badge-danger' : 'badge-success'}">
                            ${booking.is_canceled ? '已取消' : '已确认'}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        // Load Bookings
        async function loadBookings() {
            try {
                const res = await fetch(`${API_BASE}/bookings?limit=${pageSize}&offset=${(currentPage - 1) * pageSize}`);
                const data = await res.json();
                renderBookings(data.bookings);
                renderPagination(data.total);
            } catch (err) {
                console.error('Error loading bookings:', err);
            }
        }

        function renderBookings(bookings) {
            const tbody = document.getElementById('bookings-table');
            tbody.innerHTML = bookings.map(booking => `
                <tr>
                    <td>${booking.id}</td>
                    <td>${booking.hotel}</td>
                    <td>${booking.country || '-'}</td>
                    <td>${booking.market_segment || '-'}</td>
                    <td>${booking.lead_time}</td>
                    <td>
                        <span class="badge ${booking.is_canceled ? 'badge-danger' : 'badge-success'}">
                            ${booking.is_canceled ? '已取消' : '已确认'}
                        </span>
                    </td>
                    <td>
                        <div class="table-actions">
                            <button class="btn btn-sm btn-primary" onclick="editBooking(${booking.id})">编辑</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteBooking(${booking.id})">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function renderPagination(total) {
            const totalPages = Math.ceil(total / pageSize);
            const pagination = document.getElementById('pagination');
            
            let html = '';
            for (let i = 1; i <= Math.min(totalPages, 10); i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            pagination.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadBookings();
        }

        // Search
        async function searchBookings() {
            const keyword = document.getElementById('search-input').value;
            if (!keyword) {
                loadBookings();
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/bookings?keyword=${keyword}`);
                const data = await res.json();
                renderBookings(data.bookings);
            } catch (err) {
                console.error('Error searching:', err);
            }
        }

        // Modal
        function openCreateModal() {
            document.getElementById('modal-title').textContent = '新增预订';
            document.getElementById('booking-form').reset();
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const bookingData = {
                hotel: document.getElementById('form-hotel').value,
                country: document.getElementById('form-country').value,
                market_segment: document.getElementById('form-market').value,
                lead_time: parseInt(document.getElementById('form-lead-time').value),
                is_canceled: 0,
                adults: 2,
                children: 0,
                babies: 0,
                arrival_date_year: 2017,
                arrival_date_month: 1,
                stays_in_weekend_nights: 0,
                stays_in_week_nights: 1
            };
            
            try {
                const res = await fetch(`${API_BASE}/bookings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookingData)
                });
                if (res.ok) {
                    closeModal();
                    loadBookings();
                }
            } catch (err) {
                console.error('Error creating booking:', err);
            }
        });

        async function deleteBooking(id) {
            if (!confirm('确定要删除这个预订吗？')) return;
            try {
                await fetch(`${API_BASE}/bookings/${id}`, { method: 'DELETE' });
                loadBookings();
            } catch (err) {
                console.error('Error deleting:', err);
            }
        }

        function editBooking(id) {
            alert('编辑功能需要实现获取单个预订的逻辑');
        }

        // Prediction
        document.getElementById('prediction-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const bookingData = {
                hotel: document.getElementById('hotel').value,
                lead_time: parseInt(document.getElementById('lead_time').value),
                adults: parseInt(document.getElementById('adults').value),
                children: parseInt(document.getElementById('children').value),
                arrival_date_year: parseInt(document.getElementById('arrival_date_year').value),
                arrival_date_month: parseInt(document.getElementById('arrival_date_month').value),
                stays_in_weekend_nights: parseInt(document.getElementById('stays_in_weekend_nights').value),
                stays_in_week_nights: parseInt(document.getElementById('stays_in_week_nights').value),
                total_of_special_requests: parseInt(document.getElementById('total_of_special_requests').value),
                booking_changes: parseInt(document.getElementById('booking_changes').value),
                is_repeated_guest: parseInt(document.getElementById('is_repeated_guest').value),
                babies: 0,
                meal: 'BB',
                country: 'PRT',
                market_segment: 'Online TA',
                distribution_channel: 'TA/TO',
                previous_cancellations: 0,
                previous_bookings_not_canceled: 0,
                reserved_room_type: 'A',
                assigned_room_type: 'A',
                deposit_type: 'No Deposit',
                agent: 0,
                company: 0,
                days_in_waiting_list: 0,
                customer_type: 'Transient',
                adr: 100,
                required_car_parking_spaces: 0
            };
            
            const model = document.getElementById('model-select').value;
            
            try {
                const res = await fetch(`${API_BASE}/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ booking: bookingData, model: model })
                });
                const result = await res.json();
                displayPredictionResult(result);
            } catch (err) {
                console.error('Error predicting:', err);
                document.getElementById('prediction-result').innerHTML = `
                    <div class="prediction-result">
                        <p style="color: var(--danger);">❌ 预测失败，请确保后端服务正在运行并且已训练模型</p>
                    </div>
                `;
                document.getElementById('prediction-result').style.display = 'block';
            }
        });

        function displayPredictionResult(result) {
            const div = document.getElementById('prediction-result');
            const isCanceled = result.prediction === 1;
            const cancelProb = result.probability ? (result.probability.canceled * 100).toFixed(1) : null;
            const confirmProb = result.probability ? (result.probability.not_canceled * 100).toFixed(1) : null;
            
            div.innerHTML = `
                <div class="prediction-result">
                    <div class="prediction-label ${isCanceled ? 'prediction-canceled' : 'prediction-confirmed'}">
                        ${isCanceled ? '⚠️ 预测: 预订可能取消' : '✅ 预测: 预订大概率确认'}
                    </div>
                    <p style="margin: 12px 0; color: var(--gray);">模型: ${result.model}</p>
                    ${result.probability ? `
                        <div class="probability-bar">
                            <div class="probability-label">
                                <span>取消概率</span>
                                <span style="color: var(--danger);">${cancelProb}%</span>
                            </div>
                            <div class="probability-track">
                                <div class="probability-fill" style="width: ${cancelProb}%; background: var(--danger);"></div>
                            </div>
                        </div>
                        <div class="probability-bar" style="margin-top: 16px;">
                            <div class="probability-label">
                                <span>确认概率</span>
                                <span style="color: var(--success);">${confirmProb}%</span>
                            </div>
                            <div class="probability-track">
                                <div class="probability-fill" style="width: ${confirmProb}%; background: var(--success);"></div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            div.style.display = 'block';
        }

        // Load Model Performance
        async function loadModelPerformance() {
            try {
                const res = await fetch(`${API_BASE}/models/performance`);
                const performance = await res.json();
                
                if (performance && typeof performance === 'object' && Object.keys(performance).length > 0) {
                    const grid = document.getElementById('model-performance');
                    grid.innerHTML = Object.entries(performance).map(([name, metrics]) => `
                        <div class="model-card">
                            <div class="model-name">${name}</div>
                            <div class="model-metrics">
                                <div class="metric-item">
                                    <div class="metric-item-label">准确率</div>
                                    <div class="metric-item-value">${(metrics.accuracy * 100).toFixed(2)}%</div>
                                </div>
                                <div class="metric-item">
                                    <div class="metric-item-label">精确率</div>
                                    <div class="metric-item-value">${(metrics.precision * 100).toFixed(2)}%</div>
                                </div>
                                <div class="metric-item">
                                    <div class="metric-item-label">召回率</div>
                                    <div class="metric-item-value">${(metrics.recall * 100).toFixed(2)}%</div>
                                </div>
                                <div class="metric-item">
                                    <div class="metric-item-label">F1分数</div>
                                    <div class="metric-item-value">${(metrics.f1 * 100).toFixed(2)}%</div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error('Error loading model performance:', err);
            }
        }

        // Initialize
        loadDashboard();
    </script>
</body>
</html>
